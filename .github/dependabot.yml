version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot rewrites the SHA and the version comment.
  # npm updates are deliberately not automated in this demo repository: a dozen dependency
  # pull requests would hide the pull request that demonstrates the test agent.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
